# GeoGallery: Epics in Build-Reihenfolge. Schnittregel: ein Epic = eine Fähigkeit der Quelle (oder ein eng gekoppeltes Paar), gemeinsam geliefert und deployt.

[[epic]]
id = 1
slug = "epic-plattform-zugang"
title = "Plattform steht, die Gruppe meldet sich an"
description = "Plattform-Baseline zuerst: Podman-Container h2o (H2O-Master mit mruby, TLS 1.3, CSP, Wartungsseite), geogallery (systemd mit api, iam, webauthn, Socket Activation) und postgresql (PG 18 + PostGIS + PGroonga), libs/service-core, contracts/, Angular-Shell mit Spartan/UI, CI, Release-Manifest und GHCR-Image, ausgerollt auf eine dev-Umgebung wie prod. Darauf legt ein Bootstrap den ersten Admin an, der Admin pflegt Konten, Rollen und Gruppen in der Admin-Oberfläche, Mitglieder richten per Einmal-Link Passkey und TOTP ein und melden sich an, und bei Ausfall der api zeigt H2O die Wartungsseite."
covers = ["R1", "R2", "R3", "R25"]

[[epic]]
id = 2
slug = "epic-import-pipeline"
title = "Bilder kommen per Upload und Import ins Archiv"
description = "Web-Upload (10 gleichzeitig) und Admin-SCP/SFTP (Server auf dem Host konfiguriert dieses Epic) landen in /storage/uploads; der Import verschiebt und benennt unveränderlich nach /storage/originals, parkt SHA256-Duplikate mit Anzeige für Admin/Owner, und die Job-Queue in PostgreSQL legt Metadaten in der DB ab (inkl. Bewertung, Keywords, Autor, Kennzeichen Zeit unsicher) und erzeugt AVIF und Thumbnails mit Copyright nach R31, statisch über H2O ausgeliefert, mit ≥ 10.000 Bildern/h auf Testdaten. Keywords werden zu Tags. Dieses Epic legt den zentralen Sichtbarkeitsfilter (Default alle angemeldeten, Gruppen aus epic-plattform-zugang, privat) pro Bild an, durch den jede spätere Abfrage läuft. Dieses Epic baut den gemeinsamen 1-Mio.-Testbestand-Generator (fester Seed, Bilder nur über den Importpfad des catalog, mit Verteilung von GPS-Clustern, ~15 % ohne GPS, Albengrößen und Sichtbarkeiten inkl. Gruppen, privat und ausgeschlossen; spine AD-21) und misst mit ihm die Zahlen der Hardware-Profile (spine AD-22)."
covers = ["R4", "R6", "R9", "R10", "R11", "R12", "R13", "R14", "R16", "R27", "R31"]
after = [{ epic = 1, needs = "Konten und Anmeldung für Web-Upload und Upload-Verzeichnis pro Nutzer; Plattform-Baseline (Podman-Container, systemd-Units, UDS, service-core, DB, H2O, CI und Deployment)" }]

[[epic]]
id = 4
slug = "epic-raster-suche"
title = "Angemeldete finden Bilder in Raster, Detail und Suche"
description = "Raster mit Lazy Loading und Infinite Scroll, Detailansicht mit allen Metadaten, Volltextsuche und Filter nach Kamera, Objektiv, Jahr, Monat, Autor, Bewertung, Tags und Zeit unsicher erreichen bei 1 Mio. Bildern (synthetischer Testbestand aus epic-import-pipeline) ihre Ziele: Raster < 150 ms p95, Suche/Filter < 200 ms p95, API-Metadaten < 100 ms p95, auch während eines Imports, gemessen durch den Sichtbarkeitsfilter von epic-import-pipeline."
covers = ["R14", "R21", "R22", "R27"]
after = [{ epic = 2, needs = "Bilder mit Metadaten, Thumbnails und AVIF in DB und Ablage" }]

[[epic]]
id = 3
slug = "epic-datensicherheit-betrieb"
title = "Originale sind gesichert, der Bestand ist importiert"
description = "Originale haben RPO 0 auf ein Backup-Ziel, die DB PITR, ein dokumentierter Restore ist auf einem leeren Host in ≤ 24 h getestet; der Admin sieht Worker, Queue, DB und Speicher, stößt Reindexing an (Pipeline erneut, inkl. Suchindex aus epic-raster-suche; dass bearbeitete Werte es überstehen, prüft epic-pflege), Metriken gehen per OpenTelemetry raus, und die Verfügbarkeit wird gemessen. Danach wird der echte Bestand (~200.000) importiert und der Durchsatz auf der Mindestausstattung gemessen. Die Prüfliste-Ansicht liefert epic-ort-karte."
covers = ["R23", "R24"]
after = [{ epic = 2, needs = "Ablage /storage/originals, Job-Queue, Worker und Import, die gesichert, überwacht und für den Bestand genutzt werden" }, { epic = 4, needs = "Suchindex, den das Reindexing neu aufbaut" }]

[[epic]]
id = 5
slug = "epic-ort-karte"
title = "Bilder sind nach Ort und Ordner navigierbar und auf der Karte"
description = "GPS wird über die Fallback-Kette der Online-Anbieter reverse-geocodiert (asynchron, für den Bestand über Tage), Bilder ohne GPS bekommen den Ort aus dem Ordner oder landen unter 'Ort fehlt', Abweichungen auf der Prüfliste mit Admin-Ansicht; Navigation nach Ort und Ordnerbaum, Karte mit Kartenkacheln und serverseitigem Clustering < 300 ms, Suche per Radius, Polygon, Bounding Box sowie Filter Land/Region/Stadt bei 1 Mio. Bildern aus dem Testbestand von epic-import-pipeline."
covers = ["R17", "R18", "R19", "R20", "R22", "R23", "R32"]
after = [{ epic = 2, needs = "GPS und Ordnerpfad je Bild in der DB und der 1-Mio.-Testbestand" }, { epic = 4, needs = "Raster und Filtermechanik, die Ort-Navigation und Geo-Filter erweitern" }, { epic = 3, needs = "Admin-Oberfläche, in die die Prüfliste-Ansicht kommt" }]

[[epic]]
id = 6
slug = "epic-alben-sichtbarkeit"
title = "Alben und Sichtbarkeit bestimmen, wer was sieht"
description = "Nutzer legen Alben bewusst an und befüllen sie aus dem Raster; Sichtbarkeit pro Album wird vererbt und restriktivste gewinnt, indem dieses Epic den Sichtbarkeitsfilter von epic-import-pipeline um Alben erweitert; Owner und Admin setzen Sichtbarkeit nach R29 in der Oberfläche; die Leistungsziele halten weiter bei 1 Mio. Bildern."
covers = ["R4", "R28", "R29"]
after = [{ epic = 2, needs = "zentraler Sichtbarkeitsfilter, den dieses Epic um Alben erweitert, und der 1-Mio.-Testbestand" }, { epic = 4, needs = "Raster und Auswahl, aus denen Alben befüllt werden" }, { epic = 5, needs = "Abfragepfade von Karte und Ort-Navigation, die mit dem erweiterten Filter ihre Ziele halten" }]

[[epic]]
id = 7
slug = "epic-oeffentliche-galerie"
title = "Besucher ohne Konto sehen veröffentlichte Alben"
description = "Dieses Epic ergänzt die Stufe public im Sichtbarkeitsfilter: mit album.publish und Einwilligungsbestätigung wird ein Album public; anonyme Besucher sehen nur dessen nicht ausgeschlossene Bilder als Ableitungen, mit Positivliste (Schnittmenge) und GPS-Regel; ein Bild ist in einem Schritt aus allen public-Alben zurücknehmbar; Impressum, Datenschutz, Kontakt sind verlinkt."
covers = ["R4", "R5", "R7", "R8", "R30"]
after = [{ epic = 6, needs = "Alben und der zentrale Sichtbarkeitsfilter, den dieses Epic um public erweitert" }]

[[epic]]
id = 8
slug = "epic-pflege"
title = "Berechtigte pflegen Metadaten, Bewertung, Tags und löschen"
description = "Metadaten werden nur in der DB bearbeitet mit Originalwert daneben, Bewertung und Tags gesetzt, unsichere Zeiten korrigiert; eine Copyright-Änderung erzeugt die Ableitungen über die Pipeline von epic-import-pipeline neu; Löschen verschiebt in den Papierkorb (überall unsichtbar, auch öffentlich, wiederherstellbar), nur der Admin löscht endgültig Original und Ableitungen, Backups laufen nach ihrer Frist aus. Bearbeitete Werte überstehen ein Reindexing aus epic-datensicherheit-betrieb (dieser Test liegt hier). Als letztes Epic misst es die Leistungsziele abschließend mit echtem Bestand plus synthetischer Last bis 1 Mio., vollem Filter (Gruppen, privat, Alben, public, Papierkorb) und laufendem Import."
covers = ["R15", "R16", "R26", "R27", "R31"]
after = [{ epic = 3, needs = "Backup mit Aufbewahrungsfrist, das endgültiges Löschen berücksichtigt" }, { epic = 4, needs = "Detailansicht, in der bearbeitet wird" }, { epic = 7, needs = "öffentlicher Sichtbarkeitsfilter, den der Papierkorb mit ausblendet" }]
